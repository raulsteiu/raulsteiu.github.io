<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Stories — Prophix</title>
<style>
:root {
  --red: #EF363D;
  --dark: #1A1A2E;
  --mid: #2C2C4A;
  --light: #F4F4F8;
  --border: #E0DFF0;
  --muted: #888;
  --font: Arial, sans-serif;
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--light); color: #222; min-height: 100vh; }

/* ── Header ── */
.header {
  background: linear-gradient(135deg, var(--dark) 0%, var(--mid) 100%);
  padding: 20px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.header-left { display: flex; align-items: center; gap: 20px; }
.logo-pill { background: #fff; border-radius: 7px; padding: 7px 12px; display: inline-flex; align-items: center; }
.header h1 { font-size: 20px; font-weight: 900; color: #fff; }
.header-meta { font-size: 13px; color: rgba(255,255,255,.5); margin-top: 2px; }
.new-btn {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--red); color: #fff; text-decoration: none;
  border-radius: 8px; padding: 10px 20px; font-size: 13px; font-weight: 700;
  font-family: var(--font); white-space: nowrap; transition: background .15s;
  border: none; cursor: pointer;
}
.new-btn:hover { background: #c0272d; }

/* ── Content ── */
.content { max-width: 1080px; margin: 0 auto; padding: 28px 24px; }

/* ── Search ── */
.search-row { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.search-wrap { position: relative; flex: 1; }
.search-input {
  width: 100%; padding: 11px 16px 11px 42px;
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 14px; font-family: var(--font); outline: none;
  background: #fff; transition: border-color .15s;
}
.search-input:focus { border-color: var(--red); }
.search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: #aaa; pointer-events: none; }
.search-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #aaa; cursor: pointer; font-size: 16px; display: none; padding: 4px; }
.sort-wrap { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
.sort-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; white-space: nowrap; }
.sort-select-wrap { position: relative; }
.sort-select { appearance: none; background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 9px 28px 9px 11px; font-size: 13px; color: var(--dark); cursor: pointer; outline: none; font-family: var(--font); transition: border-color .15s; }
.sort-select:focus { border-color: var(--red); }
.sort-chev { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; color: #aaa; font-size: 11px; }
.results-count { font-size: 13px; color: var(--muted); margin-bottom: 18px; min-height: 18px; }

/* ── Grid ── */
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
@media (max-width: 960px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 680px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 440px) { .grid { grid-template-columns: 1fr; } }

/* ── Card ── */
.story-card {
  background: #fff; border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  transition: border-color .15s, box-shadow .15s, transform .15s;
  position: relative; display: flex; flex-direction: column;
}
.story-card:hover {
  border-color: var(--red);
  box-shadow: 0 4px 18px rgba(239,54,61,.10);
  transform: translateY(-2px);
}
.card-logo-wrap {
  height: 80px; background: #f9f9fc;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; flex-shrink: 0;
}
.card-logo-wrap img { max-height: 52px; max-width: 80%; object-fit: contain; }
.card-logo-fallback { font-size: 32px; color: #ccc; }
.card-body { padding: 14px 16px 10px; flex: 1; }
.story-name { font-size: 15px; font-weight: 900; color: var(--dark); margin-bottom: 3px; }
.story-url { font-size: 11px; color: #aaa; margin-bottom: 4px; word-break: break-all; }
.story-meta { font-size: 11px; color: #999; margin-bottom: 6px; }
.story-date { font-size: 11px; color: #bbb; }
.story-edited { font-size: 11px; color: #ccc; font-style: italic; margin-top: 2px; }
.lang-pills { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; margin-bottom: 8px; }
.lang-pill { background: #1A1A2E; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; letter-spacing: .3px; }
.fav-btn { position: absolute; top: 8px; right: 8px; background: transparent; border: none; cursor: pointer; font-size: 17px; line-height: 1; padding: 3px; color: #D8D6E8; transition: transform .15s, color .15s; z-index: 2; }
.fav-btn:hover { transform: scale(1.2); }
.fav-btn.fav-on { color: #F5C842; }
.card-actions {
  display: flex; align-items: center; gap: 6px;
  padding: 10px 12px; border-top: 1px solid var(--border);
  flex-shrink: 0; margin-top: auto;
}
.open-btn {
  flex: 1; background: var(--dark); color: #fff; border: none;
  border-radius: 6px; padding: 7px 10px; font-size: 12px; font-weight: 700;
  cursor: pointer; font-family: var(--font); text-decoration: none;
  text-align: center; transition: background .15s;
}
.open-btn:hover { background: var(--mid); }
.share-btn, .delete-btn {
  width: 30px; height: 30px; border-radius: 6px;
  border: 1px solid var(--border); background: transparent;
  cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; flex-shrink: 0;
}
.share-btn:hover { background: #f0f0ff; border-color: #aab; }
.delete-btn { opacity: 0; transition: opacity .15s, background .15s; }
.story-card:hover .delete-btn { opacity: 1; }
.delete-btn:hover { background: #fff0f0; border-color: #f5c6c6; }

/* ── Empty / no-results ── */
.empty { text-align: center; padding: 60px 20px; color: #999; grid-column: 1 / -1; }
.empty-icon { font-size: 44px; margin-bottom: 14px; }
.empty p { margin-bottom: 18px; font-size: 15px; }
.no-results { display: none; text-align: center; padding: 40px; color: #999; }

/* ── Modals ── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.55); z-index: 1000;
  align-items: center; justify-content: center;
}
.modal-overlay.visible { display: flex; }
.modal-box {
  background: #fff; border-radius: 12px; padding: 32px;
  width: 100%; max-width: 400px;
  box-shadow: 0 8px 40px rgba(0,0,0,.2);
}
.modal-box h3 { font-size: 17px; font-weight: 900; color: var(--dark); margin-bottom: 6px; }
.modal-box p { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
.form-field { margin-bottom: 13px; }
.form-field label { display: block; font-size: 11px; font-weight: 700; color: var(--dark); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
.form-field input { width: 100%; padding: 9px 13px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: var(--font); outline: none; }
.form-field input:focus { border-color: var(--red); }
.modal-error { font-size: 12px; color: var(--red); min-height: 16px; margin-bottom: 8px; }
.btn-primary { width: 100%; background: var(--red); color: #fff; border: none; border-radius: 6px; padding: 11px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: var(--font); }
.btn-primary:hover { background: #c0272d; }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-ghost { width: 100%; background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 13px; cursor: pointer; font-family: var(--font); margin-top: 8px; }
.btn-ghost:hover { color: var(--dark); border-color: #aaa; }
.delete-warning { font-size: 12px; color: #c0272d; padding: 10px; background: #fff0f0; border-radius: 6px; border: 1px solid #f5c6c6; margin-bottom: 18px; line-height: 1.5; }
.modal-status { font-size: 12px; text-align: center; margin-top: 10px; min-height: 16px; color: var(--muted); }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo-pill">
      <img src="/prophix-logo-1000px.png" style="height:22px;width:auto;display:block" alt="Prophix">
    </div>
    <div>
      <h1>Client Stories</h1>
      <div class="header-meta" id="story-count">Loading…</div>
    </div>
  </div>
  <a href="/new/" class="new-btn">+ New Story</a>
</div>

<div class="content">
  <div class="search-row">
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" class="search-input" id="search-input" placeholder="Search stories…"/>
      <button class="search-clear" id="search-clear">✕</button>
    </div>
    <div class="sort-wrap">
      <span class="sort-label">Sort</span>
      <div class="sort-select-wrap">
        <select class="sort-select" id="sort-select">
          <option value="edited">Last edited</option>
          <option value="created">Date created</option>
          <option value="fav">Favourites first</option>
          <option value="name">Name A–Z</option>
          <option value="status-draft">◑ Drafts only</option>
          <option value="status-approved">✓ Approved only</option>
          <option value="status-published">● Published only</option>
        </select>
        <span class="sort-chev">▾</span>
      </div>
    </div>
  </div>
  <div class="results-count" id="results-count"></div>
  <div class="grid" id="stories-grid">
    <div class="empty"><div class="empty-icon">⏳</div><p>Loading stories…</p></div>
  </div>
  <div class="no-results" id="no-results">
    <p>No stories match "<span id="no-results-q"></span>".</p>
  </div>
</div>

<!-- Auth modal — token only, no password -->
<div class="modal-overlay" id="auth-modal">
  <div class="modal-box">
    <h3>Authenticate</h3>
    <p>Paste your access token to manage stories.</p>
    <div class="form-field"><label>Access Token</label><input type="password" id="auth-token" placeholder="Paste your access token"/></div>
    <div class="modal-error" id="auth-error"></div>
    <button class="btn-primary" id="auth-submit">Unlock</button>
    <button class="btn-ghost" id="auth-cancel">Cancel</button>
  </div>
</div>

<!-- Delete modal -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal-box">
    <h3>Delete story</h3>
    <p>Permanently delete the story for <strong id="delete-client-name"></strong>?</p>
    <div class="delete-warning">This cannot be undone. The page and all files will be removed from the repository.</div>
    <div style="display:flex;gap:10px">
      <button class="btn-ghost" id="delete-cancel-btn" style="margin:0">Cancel</button>
      <button class="btn-primary" id="delete-confirm-btn" style="background:#c0272d">Delete permanently</button>
    </div>
    <div class="modal-status" id="delete-status"></div>
  </div>
</div>

<script>
// Prophix Client Story Directory — clients/index.html
// Permanent static shell — never regenerate, only edit in place.
// Reads stories.json on load; all story content lives in per-story data.json files.
// Requires a fine-grained GitHub token (Contents: read+write) for delete operations.
//
// v1.0  2026-09-15  Initial release — grid, search, sort, delete
// v1.1  2026-09-16  Favourites (cookie-based); share button; sort by fav
// v1.2  2026-09-16  flexbox card layout; flex:1 on card-body; actions pinned to bottom
// v2.0  2026-09-21  Status system — draft/approved/published badges and card tints
// v2.1  2026-09-21  Sort filter by status; story count shows published vs total

var GH_REPO = 'raulsteiu/raulsteiu.github.io';
var sessionToken = '';
var pendingDelete = null;
var STORIES = [];

// ── Load stories.json ─────────────────────────────────────────────────────────
fetch('/clients/stories.json?nocache=' + Date.now())
  .then(function(r) { return r.json(); })
  .then(function(data) {
    STORIES = data || [];
    renderGrid('');
  })
  .catch(function() {
    document.getElementById('stories-grid').innerHTML =
      '<div class="empty"><div class="empty-icon">⚠️</div><p>Could not load stories.</p></div>';
    document.getElementById('story-count').textContent = '';
  });

// ── Render ────────────────────────────────────────────────────────────────────
function renderGrid(filter) {
  var grid = document.getElementById('stories-grid');
  var noResults = document.getElementById('no-results');
  var countEl = document.getElementById('story-count');
  var q = (filter || '').toLowerCase().trim();
  var sort = (document.getElementById('sort-select') || {value:'edited'}).value || 'edited';
  var favs = getFavs();

  // Status filter
  var statusFilter = null;
  if (sort === 'status-draft') statusFilter = 'draft';
  else if (sort === 'status-approved') statusFilter = 'approved';
  else if (sort === 'status-published') statusFilter = 'published';

  var list = STORIES.filter(function(s) {
    if (statusFilter && (s.status || 'published') !== statusFilter) return false;
    return !q || s.name.toLowerCase().indexOf(q) > -1 || (s.ind||'').toLowerCase().indexOf(q) > -1 || s.slug.toLowerCase().indexOf(q) > -1;
  });

  // Sort
  if (!statusFilter) {
    if (sort === 'edited') {
      list.sort(function(a,b){ return new Date(b.edited||b.created||0) - new Date(a.edited||a.created||0); });
    } else if (sort === 'created') {
      list.sort(function(a,b){ return new Date(b.created||0) - new Date(a.created||0); });
    } else if (sort === 'name') {
      list.sort(function(a,b){ return a.name.localeCompare(b.name); });
    } else if (sort === 'fav') {
      list.sort(function(a,b){
        var af = favs.indexOf(a.slug) > -1 ? 1 : 0;
        var bf = favs.indexOf(b.slug) > -1 ? 1 : 0;
        return (bf - af) || (new Date(b.edited||b.created||0) - new Date(a.edited||a.created||0));
      });
    }
  }

  var publishedCount = STORIES.filter(function(s){ return !s.status || s.status === 'published'; }).length;
  countEl.textContent = STORIES.length + ' stor' + (STORIES.length === 1 ? 'y' : 'ies') + ' (' + publishedCount + ' published)';

  document.getElementById('results-count').textContent = q
    ? list.length + ' result' + (list.length===1?'':'s') + ' for "' + q + '"'
    : '';

  if (list.length === 0 && !q) {
    grid.innerHTML = '<div class="empty"><div class="empty-icon">📂</div><p>No client stories published yet.</p><a href="/new/" class="new-btn" style="display:inline-flex;margin-top:4px">+ Create your first story</a></div>';
    noResults.style.display = 'none';
    return;
  }

  if (list.length === 0) {
    grid.innerHTML = '';
    document.getElementById('no-results-q').textContent = q;
    noResults.style.display = 'block';
    return;
  }

  noResults.style.display = 'none';
  var favs = getFavs();
  grid.innerHTML = list.map(function(s) {
    var logoHtml = s.logo
      ? '<img src="/clients/' + s.slug + '/logo.png?v=' + (s.created||'') + '" alt="' + s.name + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'">' +
        '<div class="card-logo-fallback" style="display:none">📄</div>'
      : '<div class="card-logo-fallback">📄</div>';

    var editedStr = s.edited
      ? 'Edited ' + new Date(s.edited).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})
      : '';
    var createdStr = s.created
      ? new Date(s.created).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'})
      : '';

    var metaLine = s.ind ? '<div class="story-meta">' + s.ind + '</div>' : '';
    var dateLine = editedStr ? '<div class="story-edited">' + editedStr + '</div>'
      : (createdStr ? '<div class="story-edited">Published ' + createdStr + '</div>' : '');
    var langPills = (s.langs && s.langs.length > 0)
      ? '<div class="lang-pills">' + s.langs.map(function(l){ return '<span class="lang-pill">' + l.toUpperCase() + '</span>'; }).join('') + '</div>'
      : '';
    var isFav = favs.indexOf(s.slug) > -1;

    // Status badge and card tint
    var cardStyle = '';
    var statusBadge = '';
    var st = s.status || 'published';
    if (st === 'draft') {
      cardStyle = 'background:#f0f4ff;';
      statusBadge = '<div style="font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;margin-bottom:6px;display:inline-block;background:#dce5ff;color:#3355cc">◑ Draft</div>';
    } else if (st === 'approved') {
      cardStyle = 'background:#f0fff4;';
      statusBadge = '<div style="font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;margin-bottom:6px;display:inline-block;background:#c8f0d8;color:#2a7a2a">✓ Approved</div>';
    }

    return '<div class="story-card" id="card-' + s.slug + '" style="' + cardStyle + '">' +
      '<div class="card-logo-wrap">' + logoHtml +
        '<button class="fav-btn' + (isFav ? ' fav-on' : '') + '" onclick="toggleFav(\'' + s.slug + '\')" title="' + (isFav ? 'Remove from favourites' : 'Add to favourites') + '">★</button>' +
      '</div>' +
      '<div class="card-body">' +
        statusBadge +
        '<div class="story-name">' + s.name + '</div>' +
        metaLine +
        dateLine +
        langPills +
      '</div>' +
      '<div class="card-actions">' +
        '<a class="open-btn" href="/clients/' + s.slug + '/">Open &#x2192;</a>' +
        '<button class="share-btn" onclick="shareStory(\'' + s.slug + '\')" title="Copy link">⧉</button>' +
        '<button class="delete-btn" onclick="confirmDelete(\'' + s.slug + '\',\'' + s.name.replace(/'/g,'\\x27') + '\')" title="Delete story">🗑</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

// ── Share ─────────────────────────────────────────────────────────────────────
function shareStory(slug) {
  var url = 'https://raulsteiu.github.io/clients/' + slug + '/';
  navigator.clipboard.writeText(url).then(function() {
    var btn = document.querySelector('#card-' + slug + ' .share-btn');
    if (btn) { var orig = btn.textContent; btn.textContent = '✓'; setTimeout(function() { btn.textContent = orig; }, 1800); }
  }).catch(function() { prompt('Copy this link:', url); });
}

function copyEditLink(url) {
  var full = 'https://raulsteiu.github.io' + url;
  navigator.clipboard.writeText(full).then(function() {
    document.querySelectorAll('.share-btn').forEach(function(b) {
      if (b.title === 'Copy edit link' && b.textContent === '✏') {
        var orig = b.textContent; b.textContent = '✓';
        setTimeout(function() { b.textContent = orig; }, 1800);
      }
    });
  }).catch(function() { prompt('Copy this edit link:', full); });
}

// ── Auth — token only ─────────────────────────────────────────────────────────
function showAuth(onSuccess) {
  var modal = document.getElementById('auth-modal');
  modal._cb = onSuccess;
  modal.classList.add('visible');
  setTimeout(function() { document.getElementById('auth-token').focus(); }, 50);
}
function hideAuth() {
  document.getElementById('auth-modal').classList.remove('visible');
  document.getElementById('auth-token').value = '';
  document.getElementById('auth-error').textContent = '';
}
document.getElementById('auth-submit').addEventListener('click', function() {
  var tok = document.getElementById('auth-token').value.trim().replace(/[^\x20-\x7E]/g,'');
  document.getElementById('auth-error').textContent = '';
  if (!tok) { document.getElementById('auth-error').textContent = 'Please paste your access token.'; return; }
  sessionToken = tok;
  var cb = document.getElementById('auth-modal')._cb;
  hideAuth();
  if (cb) cb();
});
document.getElementById('auth-cancel').addEventListener('click', hideAuth);
['auth-token'].forEach(function(id) {
  document.getElementById(id).addEventListener('keydown', function(e) {
    if (e.key==='Enter') document.getElementById('auth-submit').click();
    if (e.key==='Escape') hideAuth();
  });
});

// ── Delete ────────────────────────────────────────────────────────────────────
function confirmDelete(slug, name) {
  var proceed = function() {
    pendingDelete = {slug:slug, name:name};
    document.getElementById('delete-client-name').textContent = name;
    document.getElementById('delete-status').textContent = '';
    document.getElementById('delete-confirm-btn').disabled = false;
    document.getElementById('delete-confirm-btn').textContent = 'Delete permanently';
    document.getElementById('delete-modal').classList.add('visible');
  };
  sessionToken ? proceed() : showAuth(proceed);
}

document.getElementById('delete-cancel-btn').addEventListener('click', function() {
  document.getElementById('delete-modal').classList.remove('visible');
  pendingDelete = null;
});

document.getElementById('delete-confirm-btn').addEventListener('click', async function() {
  if (!pendingDelete) return;
  var btn = this;
  var statusEl = document.getElementById('delete-status');
  btn.disabled = true; btn.textContent = 'Deleting…';
  try {
    var slug = pendingDelete.slug;
    statusEl.textContent = 'Finding files…';
    var listRes = await fetch('https://api.github.com/repos/'+GH_REPO+'/contents/clients/'+slug+'/', {
      headers: {'Authorization':'Bearer '+sessionToken,'Accept':'application/vnd.github+json'}
    });
    if (!listRes.ok) throw new Error('Could not list folder');
    var files = await listRes.json();
    for (var i = 0; i < files.length; i++) {
      statusEl.textContent = 'Removing file '+(i+1)+'/'+files.length+'…';
      await fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+files[i].path, {
        method: 'DELETE',
        headers: {'Authorization':'Bearer '+sessionToken,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
        body: JSON.stringify({message:'Delete client: '+slug, sha:files[i].sha})
      });
    }
    STORIES = STORIES.filter(function(s){ return s.slug !== slug; });
    statusEl.textContent = 'Updating index…';
    await pushStoriesJSON();
    var card = document.getElementById('card-'+slug); if (card) card.remove();
    document.getElementById('story-count').textContent = STORIES.length+' published stor'+(STORIES.length===1?'y':'ies');
    statusEl.textContent = 'Deleted.';
    setTimeout(function() {
      document.getElementById('delete-modal').classList.remove('visible');
      pendingDelete = null;
      renderGrid(document.getElementById('search-input').value);
    }, 1200);
  } catch(e) {
    statusEl.textContent = 'Error: '+e.message;
    btn.disabled = false; btn.textContent = 'Delete permanently';
  }
});

// ── Push stories.json ─────────────────────────────────────────────────────────
async function pushStoriesJSON() {
  var content = btoa(unescape(encodeURIComponent(JSON.stringify(STORIES, null, 2))));
  var ex = await fetch('https://api.github.com/repos/'+GH_REPO+'/contents/clients/stories.json', {
    headers: {'Authorization':'Bearer '+sessionToken,'Accept':'application/vnd.github+json'}
  });
  var body = {message:'Update stories index', content:content};
  if (ex.ok) body.sha = (await ex.json()).sha;
  var res = await fetch('https://api.github.com/repos/'+GH_REPO+'/contents/clients/stories.json', {
    method:'PUT', headers:{'Authorization':'Bearer '+sessionToken,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if (!res.ok) throw new Error('Failed to update stories index');
}

// ── Favourites (cookie-based for persistence) ─────────────────────────────────
function getFavs() {
  var match = document.cookie.match(/(?:^|;\s*)prophix-favs=([^;]*)/);
  try { return match ? JSON.parse(decodeURIComponent(match[1])) : []; } catch(e) { return []; }
}
function setFavs(favs) {
  var exp = new Date(Date.now() + 365*24*60*60*1000).toUTCString();
  document.cookie = 'prophix-favs=' + encodeURIComponent(JSON.stringify(favs)) + '; expires=' + exp + '; path=/';
}
function toggleFav(slug) {
  var favs = getFavs();
  var idx = favs.indexOf(slug);
  if (idx > -1) { favs.splice(idx, 1); } else { favs.push(slug); }
  setFavs(favs);
  renderGrid(document.getElementById('search-input').value);
}

// ── Search wiring ─────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  var input = document.getElementById('search-input');
  var clear = document.getElementById('search-clear');
  var sortSel = document.getElementById('sort-select');
  input.addEventListener('input', function() {
    clear.style.display = this.value ? 'block' : 'none';
    renderGrid(this.value);
  });
  clear.addEventListener('click', function() {
    input.value = ''; this.style.display = 'none';
    renderGrid(''); input.focus();
  });
  sortSel.addEventListener('change', function() {
    renderGrid(input.value);
  });
});
</script>
