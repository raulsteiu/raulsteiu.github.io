<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Stories — Prophix</title>
<style>
:root{--red:#EF363D;--dark:#1A1A2E;--light:#F7F7FB;--border:#E0DFF0;--font:Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--light);color:#222;min-height:100vh}
.header{background:linear-gradient(135deg,#1A1A2E 0%,#2C2C4A 100%);padding:40px;color:#fff}
.logo-pill{background:#fff;border-radius:8px;padding:8px 14px;display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:900;color:var(--red);margin-bottom:16px}
.logo-sq{width:22px;height:22px;background:var(--red);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:900}
.header h1{font-size:28px;font-weight:900;color:#fff;margin-bottom:6px}
.header p{font-size:14px;color:rgba(255,255,255,.6)}
.content{max-width:900px;margin:0 auto;padding:40px 24px}
.empty{text-align:center;padding:60px;color:#999;font-size:15px}
.new-btn{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;text-decoration:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:700;font-family:var(--font);margin-top:24px}
.new-btn:hover{background:#c0272d}
</style>
</head>
<body>
<div class="header">
  <div class="logo-pill"><img src="/prophix-logo-1000px.png" style="height:24px;width:auto;display:block"></div>
  <h1>Client Stories</h1>
  <p>All published customer stories</p>
</div>
<div class="content">
  <div class="empty">No stories published yet.<br><br><a href="/new/" class="new-btn">+ Create First Story</a></div>
</div>
</body>
</html>
