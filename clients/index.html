<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Stories — Prophix</title>
<style>:root{--red:#EF363D;--dark:#1A1A2E;--light:#F7F7FB;--border:#E0DFF0;--font:Arial,sans-serif}*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font);background:var(--light);color:#222;min-height:100vh}.header{background:linear-gradient(135deg,#1A1A2E 0%,#2C2C4A 100%);padding:40px;color:#fff}.logo-pill{background:#fff;border-radius:8px;padding:8px 14px;display:inline-flex;align-items:center;gap:8px;margin-bottom:16px}.header h1{font-size:28px;font-weight:900;color:#fff;margin-bottom:6px}.header p{font-size:14px;color:rgba(255,255,255,.6)}.content{max-width:900px;margin:0 auto;padding:40px 24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}.story-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:24px;text-decoration:none;color:#222;transition:all .2s;display:block}.story-card:hover{border-color:var(--red);box-shadow:0 4px 16px rgba(239,54,61,0.1);transform:translateY(-2px)}.story-icon{font-size:32px;margin-bottom:12px}.story-name{font-size:16px;font-weight:900;color:var(--dark);margin-bottom:6px}.story-url{font-size:12px;color:#999}.new-btn{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;text-decoration:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:700;font-family:var(--font);margin-top:24px}.new-btn:hover{background:#c0272d}</style>
</head>
<body>
<div class="header"><div class="logo-pill"><img src="/prophix-logo-1000px.png" style="height:24px;width:auto;display:block"></div><h1>Client Stories</h1><p>1 published story</p></div>
<div class="content"><div class="grid"><a href="/clients/raul-test-srl/" class="story-card" data-story="raul-test-srl"><div class="story-icon">&#x1F4C4;</div><div class="story-name">raul-test-srl</div><div class="story-url">raulsteiu.github.io/clients/raul-test-srl</div></a></div>
<a href="/new/" class="new-btn">+ Create New Story</a></div>
</body>
</html>
